name: Backend CI - Validação e Auto Merge

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'

# Permissões necessárias para o GitHub Actions criar PRs e fazer merges
permissions:
  contents: write
  pull-requests: write

jobs:
  validate-code:
    name: Validar Código (TypeScript & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Checagem de Tipos (TypeScript)
        run: npm run type-check

      - name: Testar Build de Compilação
        run: npm run build

  # Job que cria a PR e faz o merge automático apenas quando o push for em branch feature/**
  auto-merge-dev:
    name: Criar PR e Merge para dev
    needs: validate-code
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Criar PR e realizar Merge na branch dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_ATUAL="${GITHUB_REF#refs/heads/}"
          
          # Verifica se já existe PR aberta para essa branch em direção à dev
          PR_URL=$(gh pr list --head "$BRANCH_ATUAL" --base dev --json url -q '.[0].url')

          # Se não existir, cria a PR
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base dev \
              --head "$BRANCH_ATUAL" \
              --title "Auto PR: $BRANCH_ATUAL -> dev" \
              --body "PR gerada automaticamente após sucesso nos testes de CI.")
          fi

          # Realiza o merge da PR na branch dev
          gh pr merge "$PR_URL" --merge
  # Job para gerar Tag automática quando a main for atualizada
  create-tag:
    name: Criar Tag de Versão
    needs: validate-code
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para ler o histórico de tags anteriores

      - name: Gerar Tag Automática
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch 