name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'                   # Executa apenas se houver mudanças na pasta frontend
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o ambiente do Node.js com cache das dependências
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json' # Aponta para o lockfile do frontend

      # 3. Instala as dependências dentro da pasta frontend
      - name: Instalar dependências
        run: |
          cd frontend
          npm ci

      # 4. Executa os testes automatizados
      - name: Executar testes
        run: |
          cd frontend
          npm test -- --watchAll=false --passWithNoTests

      # 5. Gera a build de produção
      - name: Executar Build
        run: |
          cd frontend
          npm run build